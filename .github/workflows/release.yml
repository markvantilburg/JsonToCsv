name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --solution JsonToCsv.slnx --configuration Release

      - name: Publish
        run: |
          mkdir -p dist
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet publish JsonToCsv/JsonToCsv.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              --output "out/$rid" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None \
              -p:Version=${{ steps.version.outputs.version }}

            name="JsonToCsv-${{ steps.version.outputs.version }}-$rid"
            if [[ "$rid" == win-* ]]; then
              (cd "out/$rid" && zip -q "../../dist/$name.zip" *)
            else
              tar -czf "dist/$name.tar.gz" -C "out/$rid" .
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
